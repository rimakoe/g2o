services:

  g2o:
    image: g2o:latest
    pull_policy: missing
    container_name: g2o
    stdin_open: true
    tty: true
    privileged: true
    build:
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      - type: bind
        source: ../
        target: /home/workspace/g2o
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
    network_mode: host
    pid: "host"
    ipc: "host"
    environment:
      DISPLAY: $DISPLAY
      LD_LIBRARY_PATH: /usr/local/lib/python3.10/dist-packages/g2opy
      PYTHONPATH: /usr/local/lib/python3.10/dist-packages/g2opy
      MYPATH: /usr/local/lib/python3.10/dist-packages/g2opy
